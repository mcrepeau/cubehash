name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  build-and-verify-native:
    name: Native build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build (release)
        run: cargo build --release
      - name: Verify hashes from manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="testfiles/manifest.txt"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "No manifest found at $MANIFEST. Skipping verification on native." >&2
            exit 0
          fi
          # Format: path,revision,hashlen,expected_hex
          # revision: 2 or 3
          # hashlen: e.g. 256
          fail=0
          while IFS=, read -r path rev hashlen expected; do
            [[ -z "$path" || "$path" =~ ^\s*# ]] && continue
            path=$(echo "$path" | xargs)
            rev=$(echo "$rev" | xargs)
            hashlen=$(echo "$hashlen" | xargs)
            expected=$(echo "$expected" | tr -d '\r\n' | xargs)
            if [[ ! -f "$path" ]]; then
              echo "Missing test file: $path" >&2
              fail=1
              continue
            fi
            revflag="-3"
            [[ "$rev" == "2" ]] && revflag="-2"
            out=$(cargo run --release --quiet -- $revflag -l "$hashlen" < "$path")
            if [[ "$out" != "$expected" ]]; then
              echo "Mismatch: $path (rev=$rev len=$hashlen)" >&2
              echo " expected: $expected" >&2
              echo "   actual: $out" >&2
              fail=1
            else
              echo "OK: $path (rev=$rev len=$hashlen)"
            fi
          done < "$MANIFEST"
          exit $fail

  cross-verify-linux:
    name: Cross verify (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (release)
        run: cross build --release --target ${{ matrix.target }}
      - name: Verify hashes from manifest
        if: ${{ hashFiles('testfiles/manifest.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="testfiles/manifest.txt"
          fail=0
          while IFS=, read -r path rev hashlen expected; do
            [[ -z "$path" || "$path" =~ ^\s*# ]] && continue
            path=$(echo "$path" | xargs)
            rev=$(echo "$rev" | xargs)
            hashlen=$(echo "$hashlen" | xargs)
            expected=$(echo "$expected" | tr -d '\r\n' | xargs)
            if [[ ! -f "$path" ]]; then
              echo "Missing test file: $path" >&2
              fail=1
              continue
            fi
            revflag="-3"
            [[ "$rev" == "2" ]] && revflag="-2"
            out=$(cross run --release --target ${{ matrix.target }} --quiet -- $revflag -l "$hashlen" < "$path")
            if [[ "$out" != "$expected" ]]; then
              echo "Mismatch: $path (rev=$rev len=$hashlen on ${{ matrix.target }})" >&2
              echo " expected: $expected" >&2
              echo "   actual: $out" >&2
              fail=1
            else
              echo "OK: $path (rev=$rev len=$hashlen on ${{ matrix.target }})"
            fi
          done < "$MANIFEST"
          exit $fail
