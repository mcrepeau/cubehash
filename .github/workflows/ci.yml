name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  build-and-verify-native:
    name: Native build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build (release)
        run: cargo build --release
      - name: Run unit tests
        run: cargo test --release
      - name: Verify hashes from manifest
        shell: bash
        run: bash scripts/verify_manifest.sh
