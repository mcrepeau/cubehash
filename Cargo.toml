[package]
name = "cubehash"
version = "0.1.0"
authors = ["Matthieu Crépeau <matthieu.crepeau@ibm.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cubehash"
path = "src/lib.rs"

[features]
default = []
force-scalar = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hash_bench"
harness = false
