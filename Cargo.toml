[package]
name = "cubehash"
version = "0.4.0"
authors = ["Matthieu Crépeau <matthieu.crepeau@outlook.com>"]
edition = "2021"
description = "CubeHash (rev2/rev3) hashing with SIMD acceleration and portable fallback"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mcrepeau/cubehash"
homepage = "https://github.com/mcrepeau/cubehash"
documentation = "https://docs.rs/cubehash"
keywords = ["hash", "cubehash", "crypto", "simd"]
categories = ["cryptography", "algorithms"]
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE*",
  "src/cubehash.rs",
  "src/lib.rs",
  "src/avx2.rs",
  "src/sse2.rs",
  "src/neon.rs",
  "src/scalar.rs",
  "src/wasm32.rs"
]

[lib]
name = "cubehash"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
force-scalar = []
# Enable this feature when targeting wasm (lets you `--features wasm`)
wasm = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "hash_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
