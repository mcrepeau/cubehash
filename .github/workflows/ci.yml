name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  build-and-verify-native:
    name: Native build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build (release)
        run: cargo build --release
      - name: Run unit tests
        run: cargo test --release
      - name: Verify hashes from manifest
        shell: bash
        run: bash scripts/verify_manifest.sh

  verify-wasm-digests:
    name: Verify WASM digests (wasm32)
    runs-on: ubuntu-latest
    env:
      WASMTIME_VERSION: "50.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz | tar -xJ -C /tmp
          echo "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> $GITHUB_PATH
      - name: Build digest check (simd128)
        working-directory: wasm-digest-check
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: cargo build --release --target wasm32-wasip1
      - name: Run digest check (simd128)
        working-directory: wasm-digest-check
        run: wasmtime run target/wasm32-wasip1/release/wasm-digest-check.wasm
      - name: Build digest check (scalar)
        working-directory: wasm-digest-check
        run: cargo build --release --target wasm32-wasip1
      - name: Run digest check (scalar)
        working-directory: wasm-digest-check
        run: wasmtime run target/wasm32-wasip1/release/wasm-digest-check.wasm
